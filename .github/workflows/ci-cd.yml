name: CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  PROJECT_DIR: "app"
  SMOKE_STRICT: "false"

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
          cache-dependency-path: ${{ env.PROJECT_DIR }}/pom.xml

      - name: Spotless (check only)
        run: mvn -B -ntp spotless:check

      - name: Checkstyle
        run: mvn -B -ntp checkstyle:check

  build-and-test:
    name: Build & Test (Maven)
    runs-on: ubuntu-26.04
    needs: lint
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
          cache-dependency-path: ${{ env.PROJECT_DIR }}/pom.xml

      - name: Build & Test (verify)
        run: mvn -B -ntp verify   # compile + test + package + integration-test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ${{ env.PROJECT_DIR }}/target/*.jar
          retention-days: 2